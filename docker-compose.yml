version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: bt-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: billiontech
      POSTGRES_USER: bt_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bt_user -d billiontech"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bt-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bt-backend
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      # Hardcoded for Docker networking — containers use container names, not localhost
      DB_URL: jdbc:postgresql://bt-postgres:5432/billiontech
      DB_USERNAME: bt_user
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_URL: redis://bt-redis:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3010}
      JWT_SECRET: ${JWT_SECRET:-}
      QBO_CLIENT_ID: ${QBO_CLIENT_ID:-}
      QBO_CLIENT_SECRET: ${QBO_CLIENT_SECRET:-}
      QBO_REDIRECT_URI: ${QBO_REDIRECT_URI:-}
      QBO_ENVIRONMENT: ${QBO_ENVIRONMENT:-sandbox}
      QBO_ENCRYPTION_KEY: ${QBO_ENCRYPTION_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bt-frontend
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      # Browser-side API calls must use a host-reachable URL, not the Docker service name
      VITE_API_BASE_URL: http://localhost:8085
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
