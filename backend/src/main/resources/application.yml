server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: bookkeeping

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/billiontech}
    username: ${DB_USERNAME:bt_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6380}

  # Allow frontend dev server origin for CORS
  web:
    cors:
      allowed-origins: ${FRONTEND_URL:http://localhost:3010}

management:
  endpoints:
    web:
      exposure:
        include: health,info
