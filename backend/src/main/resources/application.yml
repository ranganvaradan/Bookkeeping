server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: bookkeeping

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/billiontech}
    username: ${DB_USERNAME:bt_user}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway manages the schema; Hibernate should not modify or validate it
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Fail fast if migration files are missing or corrupted
    validate-on-migrate: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6380}

  # Allow frontend dev server origin for CORS
  web:
    cors:
      allowed-origins: ${FRONTEND_URL:http://localhost:3010}

jwt:
  secret: ${JWT_SECRET:default-dev-secret-must-be-at-least-32-chars!!}

qbo:
  client-id: ${QBO_CLIENT_ID:}
  client-secret: ${QBO_CLIENT_SECRET:}
  redirect-uri: ${QBO_REDIRECT_URI:http://localhost:8085/api/qbo/callback}
  environment: ${QBO_ENVIRONMENT:sandbox}
  encryption-key: ${QBO_ENCRYPTION_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
